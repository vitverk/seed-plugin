name: Validate plugin package

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docs_smoke:
        description: Run read-only hosted MCP documentation smoke
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package
      - name: Optional documentation MCP smoke
        if: github.event_name == 'workflow_dispatch' && inputs.docs_smoke
        run: npm run smoke:docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seed-plugin-package
          path: dist/
          if-no-files-found: error
